<div class="auth-container">
  <div class="auth-background">
    <div class="shape shape-1"></div>
    <div class="shape shape-2"></div>
    <div class="shape shape-3"></div>
  </div>

  <div class="auth-card glass">
    <div class="header">
      <h2>Welcome Back</h2>
      <p class="subtitle">Continue your journey with Habitat</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="form-group floating-label">
        <input type="email" id="email" formControlName="email" placeholder=" " autocomplete="email">
        <label for="email">Email Address</label>
      </div>

      <div class="form-group floating-label">
        <input type="password" id="password" formControlName="password" placeholder=" " autocomplete="current-password">
        <label for="password">Password</label>
      </div>

      <div class="error-message" *ngIf="error">
        <span class="icon">!</span> {{ error }}
      </div>

      <button type="submit" class="submit-btn" [disabled]="!loginForm.valid">
        <span>Sign In</span>
        <span class="arrow">→</span>
      </button>
    </form>

    <div class="footer">
      <p>New to Habitat? <a routerLink="/register">Create an account</a></p>
    </div>
  </div>
</div>
