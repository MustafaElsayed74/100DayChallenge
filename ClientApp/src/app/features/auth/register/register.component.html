<div class="auth-container">
    <div class="auth-background">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
        <div class="shape shape-3"></div>
    </div>

    <div class="auth-card glass">
        <div class="header">
            <h2>Join Habitat</h2>
            <p class="subtitle">Start your first 100-day challenge</p>
        </div>

        <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
            <div class="form-group floating-label">
                <input type="text" id="fullName" formControlName="fullName" placeholder=" " autocomplete="name">
                <label for="fullName">Full Name</label>
            </div>

            <div class="form-group floating-label">
                <input type="email" id="email" formControlName="email" placeholder=" " autocomplete="email">
                <label for="email">Email Address</label>
            </div>

            <div class="form-group floating-label">
                <input type="password" id="password" formControlName="password" placeholder=" "
                    autocomplete="new-password">
                <label for="password">Password (Min 6 chars)</label>
            </div>

            <div class="error-message" *ngIf="error">
                <span class="icon">!</span> {{ error }}
            </div>

            <button type="submit" class="submit-btn" [disabled]="!registerForm.valid">
                <span>Create Account</span>
                <span class="arrow">→</span>
            </button>
        </form>

        <div class="footer">
            <p>Already have an account? <a routerLink="/login">Sign In</a></p>
        </div>
    </div>
</div>
