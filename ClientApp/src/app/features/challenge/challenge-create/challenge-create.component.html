<div class="create-container">
  <div class="create-card">
    <h2>Create New Challenge</h2>

    <form (ngSubmit)="onSubmit()" #challengeForm="ngForm">

      <div class="form-group">
        <label for="title">Title</label>
        <input type="text" id="title" name="title" [(ngModel)]="model.title" required
          placeholder="e.g. 100 Days of Running">
      </div>

      <div class="form-group">
        <label for="goalDescription">Goal Description</label>
        <textarea id="goalDescription" name="goalDescription" [(ngModel)]="model.goalDescription" required rows="3"
          placeholder="What is your goal?"></textarea>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="startDate">Start Date</label>
          <input type="date" id="startDate" name="startDate" [(ngModel)]="model.startDate" required>
        </div>

        <div class="form-group">
          <label for="durationDays">Duration (Days)</label>
          <input type="number" id="durationDays" name="durationDays" [(ngModel)]="model.durationDays" required min="1"
            max="365">
        </div>
      </div>

      <div class="form-group">
        <label for="notes">Notes</label>
        <textarea id="notes" name="notes" [(ngModel)]="model.notes" rows="2"
          placeholder="Any extra motivation..."></textarea>
      </div>

      <div class="actions">
        <button type="submit" [disabled]="!challengeForm.form.valid" class="submit-btn">
          Create Challenge
        </button>
        <a routerLink="/" class="cancel-link">Cancel</a>
      </div>

    </form>
  </div>
</div>
