<div class="create-container">
    <div class="create-card">
        <h2>Edit Challenge</h2>

        <div *ngIf="loading">Loading...</div>

        <form *ngIf="!loading" (ngSubmit)="onSubmit()" #challengeForm="ngForm">

            <div class="form-group">
                <label for="title">Title</label>
                <input type="text" id="title" name="title" [(ngModel)]="model.title" required>
            </div>

            <div class="form-group">
                <label for="goalDescription">Goal Description</label>
                <textarea id="goalDescription" name="goalDescription" [(ngModel)]="model.goalDescription" required
                    rows="3"></textarea>
            </div>

            <div class="form-group">
                <label for="notes">Notes</label>
                <textarea id="notes" name="notes" [(ngModel)]="model.notes" rows="2"></textarea>
            </div>

            <div class="form-group viewers-section">
                <h3>Manage Viewers</h3>
                <div class="add-viewer">
                    <select [(ngModel)]="selectedFriendId" name="selectedFriend" class="viewer-select">
                        <option value="" disabled>Select a friend to invite</option>
                        <option *ngFor="let friend of friends" [value]="friend.friendId">{{ friend.fullName }}</option>
                    </select>
                    <button type="button" (click)="addViewer()" [disabled]="!selectedFriendId"
                        class="add-btn">Add</button>
                </div>

                <div class="viewers-list" *ngIf="viewers.length > 0">
                    <div *ngFor="let viewer of viewers" class="viewer-item">
                        <span>{{ viewer.fullName }}</span>
                        <button type="button" (click)="removeViewer(viewer.userId)" class="remove-btn">×</button>
                    </div>
                </div>
                <div *ngIf="viewers.length === 0" class="no-viewers">No viewers yet.</div>
            </div>

            <div class="actions">
                <button type="submit" [disabled]="!challengeForm.form.valid" class="submit-btn">
                    Save Changes
                </button>
                <a [routerLink]="['/challenge', challengeId]" class="cancel-link">Cancel</a>
            </div>

        </form>
    </div>
</div>
