<div class="profile-container">
    <div class="profile-header">
        <h1>Your Profile</h1>
        <p>Manage your account settings</p>
    </div>

    <div class="messages">
        <div class="success-message" *ngIf="successMessage">{{ successMessage }}</div>
        <div class="error-message" *ngIf="errorMessage">{{ errorMessage }}</div>
    </div>

    <div class="profile-grid">
        <!-- Profile Info Card -->
        <div class="card profile-card">
            <h2>Personal Information</h2>
            <form [formGroup]="profileForm" (ngSubmit)="onProfileSubmit()">

                <div class="avatar-selection">
                    <div class="current-avatar">
                        <img *ngIf="profileForm.get('avatar')?.value" [src]="profileForm.get('avatar')?.value"
                            alt="Avatar">
                        <span *ngIf="!profileForm.get('avatar')?.value">👤</span>
                    </div>
                    <div class="avatar-grid">
                        <button type="button" *ngFor="let av of avatars" (click)="selectAvatar(av)"
                            [class.active]="profileForm.get('avatar')?.value === av">
                            <img [src]="av" alt="Avatar Option">
                        </button>
                    </div>
                </div>

                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" formControlName="fullName" placeholder="Your Name">
                </div>

                <div class="form-actions">
                    <button type="submit" [disabled]="profileForm.invalid || loading" class="btn-primary">
                        Save Changes
                    </button>
                </div>
            </form>
        </div>

        <!-- Security Card -->
        <div class="card security-card">
            <h2>Security</h2>
            <form [formGroup]="passwordForm" (ngSubmit)="onPasswordSubmit()">
                <div class="form-group">
                    <label>Current Password</label>
                    <input type="password" formControlName="currentPassword">
                </div>

                <div class="form-group">
                    <label>New Password</label>
                    <input type="password" formControlName="newPassword">
                    <small>Minimum 6 characters</small>
                </div>

                <div class="form-actions">
                    <button type="submit" [disabled]="passwordForm.invalid || loading" class="btn-secondary">
                        Update Password
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
