<div class="dashboard-container">
    <div class="header">
        <h1>Your Challenges</h1>
        <button class="create-btn" routerLink="/challenges/create">+ New Challenge</button>
    </div>

    <div class="grid">
        <div *ngFor="let challenge of challenges" class="challenge-card" [routerLink]="['/challenge', challenge.id]">
            <div class="card-header">
                <h3>{{ challenge.title }}</h3>
                <span class="dates">{{ challenge.startDate | date }} - {{ challenge.endDate | date }}</span>
            </div>

            <p class="description">{{ challenge.goalDescription }}</p>

            <div class="stats">
                <div class="stat">
                    <span class="value">{{ challenge.completedDays }}</span>
                    <span class="label">Days Done</span>
                </div>
                <div class="stat">
                    <span class="value">{{ challenge.currentStreak }}</span>
                    <span class="label">Streak</span>
                </div>
                <div class="stat">
                    <span class="value">{{ challenge.skippedDays }}</span>
                    <span class="label">Skipped</span>
                </div>
            </div>

            <div class="progress-bar">
                <div class="fill" [style.width.%]="getProgress(challenge)"></div>
            </div>
        </div>
    </div>
</div>
